<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="static/styles/style.css">
        <title>SPECS-MASTER | GPUs</title>
    </head>
    <body>
        <header>
            <nav>
                <div class="pages">
                    <a href="/" id="index-page-link" class="link"><p>Главная</p></a>
                    <a href="/gpus" id="gpus-page-link" class="link"><p>Видеокарты</p></a>
                    <a href="/cpus" id="cpus-page-link" class="link"><p>Процессоры</p></a>
                </div>
                <div class="lk-link-wrap">
                    <a href="lk.hrml"><p>Профиль</p></a>
                </div>
            </nav>
        </header>
        <main>
            <section class="about">
                <p>Здесь вы можете сравнить характеристики разных видеокарт. Выберите видеокарты и нажмите СРАВНИТЬ.</p>
            </section>
            <section class="form-wrap">
                <form id="gpus-for-compair">
                    <div class="form-group">
                        <label for="gpu1">Видеокарта 1:</label>
                        <select name="gpu1" id="gpu1" required>
                            <option value="none">Выбрать...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gpu2">Видеокарта 2:</label>
                        <select name="gpu2" id="gpu2" required>
                            <option value="none">Выбрать...</option>
                        </select>
                    </div>
                    <div class="form-controls">
                        <button type="reset">Сбросить</button>
                        <button type="submit">Сравнить</button>
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <p>None rights reserved</p>
        </footer>
        <script src="static/scripts/main.js"></script>
        <script src="static/scripts/get_gpus.js"></script>
    </body>
</html>
