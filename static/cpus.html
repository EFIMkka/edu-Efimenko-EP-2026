<!DOCTYPE html>
<html lang="ru" data-component-kind="cpus">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/styles/style.css">
    <title>Сравнение процессоров — SPECS-MASTER</title>
</head>
<body>
    <header class="site-header">
        <nav class="navigation container" aria-label="Основная навигация">
            <a class="brand" href="/">SPECS<span>-MASTER</span></a>
            <div class="nav-links">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link active" href="/cpus">Процессоры</a>
                <a class="nav-link" href="/gpus">Видеокарты</a>
            </div>
            <div class="account-links"><a class="button button-outline profile-link" href="/lk">Войти</a></div>
        </nav>
    </header>
    <main class="container page-content">
        <section class="page-intro">
            <p class="eyebrow">Каталог комплектующих</p>
            <h1>Сравнение процессоров</h1>
            <p>Выберите две модели, чтобы сопоставить число ядер и потоков, а также тактовую частоту.</p>
        </section>
        <section class="panel compare-panel">
            <form id="comparison-form" class="comparison-form">
                <div class="form-group">
                    <label for="component-one">Первый процессор</label>
                    <select id="component-one" name="first_id" required>
                        <option value="">Загрузка списка...</option>
                    </select>
                </div>
                <div class="versus" aria-hidden="true">VS</div>
                <div class="form-group">
                    <label for="component-two">Второй процессор</label>
                    <select id="component-two" name="second_id" required>
                        <option value="">Загрузка списка...</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="button button-outline" type="reset">Сбросить</button>
                    <button class="button button-primary" type="submit">Сравнить модели</button>
                </div>
            </form>
            <p id="comparison-status" class="status-message" role="status" aria-live="polite"></p>
        </section>
        <section id="comparison-result" class="comparison-result" aria-live="polite"></section>
    </main>
    <footer class="site-footer"><div class="container footer-inner"><span class="brand">SPECS<span>-MASTER</span></span><span>Данные загружаются из каталога SPECS-MASTER</span></div></footer>
    <script src="/static/scripts/main.js"></script>
    <script src="/static/scripts/comparison.js"></script>
</body>
</html>
